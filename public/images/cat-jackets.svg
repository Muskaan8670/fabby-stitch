<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="jacketBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#232621"/>
      <stop offset="100%" stop-color="#0E100D"/>
    </radialGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#jacketBg)"/>

  <!-- Jacket / Outerwear Silhouette Graphic -->
  <g transform="translate(150, 190)">
    <!-- Bomber Jacket Silhouette -->
    <path d="M 60 110 L 170 70 L 330 70 L 440 110 L 410 240 L 370 220 L 370 560 L 130 560 L 130 220 L 90 240 Z" fill="#2E332A" stroke="#485042" stroke-width="2"/>
    
    <!-- Ribbed Collar -->
    <path d="M 170 70 C 210 95, 290 95, 330 70" fill="none" stroke="#1A1C17" stroke-width="8"/>
    
    <!-- Metal Zipper Track & Gold Zipper Pull -->
    <line x1="250" y1="90" x2="250" y2="560" stroke="#1A1C17" stroke-width="4"/>
    <line x1="250" y1="90" x2="250" y2="560" stroke="#8A9682" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="245" y="200" width="10" height="20" fill="url(#goldHighlight)" rx="2"/>

    <!-- Slant Hand Pockets -->
    <line x1="150" y1="400" x2="210" y2="460" stroke="#1A1C17" stroke-width="4"/>
    <line x1="350" y1="400" x2="290" y2="460" stroke="#1A1C17" stroke-width="4"/>
  </g>

  <!-- Framing & Title -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
  <text x="400" y="910" font-family="'Geist', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#C5A059" text-anchor="middle">OUTERWEAR &amp; UTILITY JACKETS</text>
</svg>
